<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Canales</title>
<style>
  :root { --bg:#0d0f12; --panel:#171a1f; --line:#2a2f37; --text:#f3f1ea; --muted:#9a9ea6; --on:#ffb000; --live:#ff3b30; }
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font-family:"SamsungOne","Samsung Sans",Roboto,Helvetica,Arial,sans-serif; }
  #home { position:absolute; inset:0; padding:64px 88px; display:flex; flex-direction:column; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:44px; }
  h1 { margin:0; font-size:60px; font-weight:800; letter-spacing:-1px; }
  #clock { font-size:44px; font-weight:300; color:var(--muted); font-variant-numeric:tabular-nums; }
  #grid { flex:1; display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:232px; gap:24px; min-height:0; overflow:hidden; padding:8px; }
  .ch { position:relative; display:flex; flex-direction:column; justify-content:flex-end; padding:30px; min-width:0;
    background:var(--panel); border:4px solid var(--line); border-radius:14px; }
  .ch .num { position:absolute; top:24px; left:30px; font-size:28px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .ch .name { font-size:50px; font-weight:800; line-height:1.05; }
  .ch .kind { margin-top:8px; font-size:26px; color:var(--muted); }
  .ch.focus { background:var(--on); border-color:var(--on); color:#121212; transform:scale(1.03); }
  .ch.focus .num,.ch.focus .kind { color:#3c2c00; }
  footer { margin-top:32px; font-size:28px; color:var(--muted); }
  footer b { color:var(--text); font-weight:600; }
  #player { position:absolute; inset:0; display:none; background:#000; }
  #player.open { display:block; }
  #frame,#video { position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; }
  #video { display:none; }
  #tag { position:absolute; top:44px; left:52px; padding:16px 26px; border-radius:10px; font-size:34px; font-weight:700;
    background:rgba(0,0,0,.78); transition:opacity .4s; }
  #tag i { display:inline-block; width:18px; height:18px; margin-right:14px; border-radius:50%; background:var(--live); }
  #tag.hide { opacity:0; }
  .ch.add .name { color:var(--on); }
  .ch.add.focus .name { color:#121212; }
  #form { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.86); }
  #form.open { display:flex; }
  #form > div { width:1160px; padding:52px; background:var(--panel); border:4px solid var(--line); border-radius:14px; }
  #form h2 { margin:0 0 30px; font-size:48px; }
  #form label { display:block; margin:22px 0 10px; font-size:28px; color:var(--muted); }
  #form input { width:100%; padding:20px 24px; font:inherit; font-size:34px; color:var(--text); background:var(--bg); border:4px solid var(--line); border-radius:10px; outline:0; }
  #form button { margin:34px 20px 0 0; padding:18px 44px; font:inherit; font-size:32px; font-weight:700; color:var(--text); background:var(--bg); border:4px solid var(--line); border-radius:10px; }
  #form .sel { border-color:var(--on); }
  #form button.sel { background:var(--on); color:#121212; }
  #hint { margin-top:24px; min-height:36px; font-size:28px; color:var(--on); }
</style>
</head>
<body>
<main id="home">
  <header><h1>Canales</h1><div id="clock"></div></header>
  <section id="grid"></section>
  <footer><b>OK</b> mirar &nbsp;·&nbsp; <b>CH +/−</b> cambiar de canal &nbsp;·&nbsp; <b>Volver</b> salir &nbsp;·&nbsp; <b>Rojo</b> borrar canal propio</footer>
</main>
<section id="player">
  <iframe id="frame" title="Señal en vivo" allow="autoplay; encrypted-media; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <video id="video" autoplay playsinline></video>
  <div id="tag" class="hide"></div>
</section>
<section id="form">
  <div>
    <h2>Agregar transmisión</h2>
    <label for="fName">Nombre</label><input id="fName" autocomplete="off">
    <label for="fUrl">Enlace (.m3u8 o reproductor web)</label><input id="fUrl" autocomplete="off" inputmode="url">
    <div><button id="fSave">Guardar</button><button id="fCancel">Cancelar</button></div>
    <div id="hint"></div>
  </div>
</section>
<script>
(function () {
  // La lista se edita en canales.json. Esta copia se usa solo si no se puede descargar.
  var LIST_URL = 'https://raw.githubusercontent.com/Atiraboschi/canales-tv/main/canales.json';
  var CHANNELS = [
    { name: 'TN',         kind: 'Noticias',  id: 'UCj6PcyLvpnIRT_2W_mwa9Aw' },
    { name: 'C5N',        kind: 'Noticias',  id: 'UCFgk2Q2mVO1BklRQhSv6p0w' },
    { name: 'A24',        kind: 'Noticias',  id: 'UCR9120YBAqMfntqgRTKmkjQ' },
    { name: 'LA NACION',  kind: 'Noticias',  id: 'UCba3hpU7EFBSk817y9qZkiA' },
    { name: 'Crónica TV', kind: 'Noticias',  id: 'UCT7KFGv6s2a-rh2Jq8ZdM1g' },
    { name: 'Canal 26',   kind: 'Noticias',  id: 'UCrpMfcQNog595v5gAS-oUsQ' },
    { name: 'Telefe',     kind: 'General',   id: 'UCHc3el42hXKKhjs_1vzWk9A' }
  ];
  var video = document.getElementById('video'), hlsPlayer = null;
  var COLUMNS = 4, KEY = { LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, ENTER: 13, BACK: 10009, ESC: 27, CH_UP: 427, CH_DOWN: 428, RED: 403, IME_DONE: 65376, IME_CANCEL: 65385 };
  var form = document.getElementById('form'), hint = document.getElementById('hint');
  var fields = [document.getElementById('fName'), document.getElementById('fUrl'), document.getElementById('fSave'), document.getElementById('fCancel')];
  var fieldIndex = 0, baseChannels = CHANNELS, ownChannels = [];
  try { ownChannels = JSON.parse(localStorage.getItem('propios') || '[]'); } catch (e) {}
  CHANNELS = baseChannels.concat(ownChannels);
  var grid = document.getElementById('grid'), player = document.getElementById('player');
  var frame = document.getElementById('frame'), tag = document.getElementById('tag'), clock = document.getElementById('clock');
  var index = 0, tagTimer = null;

  try { index = Math.min(parseInt(localStorage.getItem('canal') || '0', 10) || 0, CHANNELS.length - 1); } catch (e) {}

  function render() {
    grid.innerHTML = '';
    CHANNELS.forEach(function (c, i) {
      var el = document.createElement('article');
      el.className = 'ch';
      el.innerHTML = '<span class="num">' + (i + 1) + '</span><div class="name"></div><div class="kind"></div>';
      el.querySelector('.name').textContent = c.name;
      el.querySelector('.kind').textContent = c.kind || '';
      grid.appendChild(el);
    });
    var add = document.createElement('article');
    add.className = 'ch add';
    add.innerHTML = '<div class="name">+ Agregar</div><div class="kind">Enlace propio</div>';
    grid.appendChild(add);
    index = Math.min(index, CHANNELS.length);
    paint();
  }

  function paint() {
    Array.prototype.forEach.call(grid.children, function (el, i) {
      el.classList.toggle('focus', i === index);
      if (i === index && el.scrollIntoView) { el.scrollIntoView({ block: 'nearest' }); }
    });
  }

  function clearMedia() {
    if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
    video.pause();
    video.removeAttribute('src');
    video.load();
    video.style.display = 'none';
    frame.style.display = 'block';
    frame.src = 'about:blank';
  }
  function playHls(url) {
    frame.style.display = 'none';
    video.style.display = 'block';
    if (video.canPlayType('application/vnd.apple.mpegurl')) { video.src = url; return; }
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js';
    s.onload = function () {
      hlsPlayer = new window.Hls();
      hlsPlayer.loadSource(url);
      hlsPlayer.attachMedia(video);
    };
    document.head.appendChild(s);
  }
  function remember() { try { localStorage.setItem('canal', String(index)); } catch (e) {} }
  function showTag() {
    tag.innerHTML = '<i></i>';
    tag.appendChild(document.createTextNode(CHANNELS[index].name));
    tag.classList.remove('hide');
    clearTimeout(tagTimer);
    tagTimer = setTimeout(function () { tag.classList.add('hide'); }, 3500);
  }
  function play() {
    var c = CHANNELS[index];
    remember();
    clearMedia();
    if (c.url && /\.m3u8(\?|$)/i.test(c.url)) { playHls(c.url); }
    else if (c.url) { frame.src = c.url; }
    else { frame.src = 'https://www.youtube.com/embed/live_stream?channel=' + c.id + '&autoplay=1&controls=0&rel=0&playsinline=1'; }
    player.classList.add('open');
    showTag();
  }
  function stop() {
    clearMedia();
    player.classList.remove('open');
    paint();
  }
  function zap(step) {
    index = (Math.min(index, CHANNELS.length - 1) + step + CHANNELS.length) % CHANNELS.length;
    paint();
    if (player.classList.contains('open')) { play(); }
  }
  function saveOwn() {
    try { localStorage.setItem('propios', JSON.stringify(ownChannels)); } catch (e) {}
    CHANNELS = baseChannels.concat(ownChannels);
    render();
  }
  function selectField(i) {
    fieldIndex = i;
    fields.forEach(function (el, n) { el.classList.toggle('sel', n === i); });
    fields[i].focus();
  }
  function openForm() {
    fields[0].value = ''; fields[1].value = ''; hint.textContent = '';
    form.classList.add('open');
    selectField(0);
  }
  function closeForm() {
    fields[fieldIndex].blur();
    form.classList.remove('open');
  }
  function submitForm() {
    var name = fields[0].value.trim(), url = fields[1].value.trim();
    if (!name || !/^https?:\/\//i.test(url)) { hint.textContent = 'Poné un nombre y un enlace que empiece con http'; return; }
    ownChannels.push({ name: name, kind: 'Propio', url: url, own: true });
    closeForm();
    saveOwn();
    index = CHANNELS.length - 1;
    paint();
  }
  function formKey(code) {
    switch (code) {
      case KEY.UP: selectField(Math.max(fieldIndex - 1, 0)); break;
      case KEY.DOWN: selectField(Math.min(fieldIndex + 1, 3)); break;
      case KEY.LEFT: if (fieldIndex === 3) { selectField(2); } else { return false; } break;
      case KEY.RIGHT: if (fieldIndex === 2) { selectField(3); } else { return false; } break;
      case KEY.ENTER:
        if (fieldIndex === 2) { submitForm(); }
        else if (fieldIndex === 3) { closeForm(); }
        else { selectField(fieldIndex + 1); }
        break;
      case KEY.IME_DONE: selectField(Math.min(fieldIndex + 1, 2)); break;
      case KEY.IME_CANCEL: fields[fieldIndex].blur(); break;
      case KEY.BACK:
      case KEY.ESC: closeForm(); break;
      default: return false;
    }
    return true;
  }
  function removeOwn() {
    var first = baseChannels.length;
    if (index < first || index >= CHANNELS.length) { return; }
    ownChannels.splice(index - first, 1);
    saveOwn();
  }
  function exitApp() {
    try { tizen.application.getCurrentApplication().exit(); } catch (e) { window.close(); }
  }
  function move(step) {
    var next = index + step;
    if (next >= 0 && next <= CHANNELS.length) { index = next; paint(); }
  }

  try {
    if (window.tizen && tizen.tvinputdevice) {
      tizen.tvinputdevice.registerKey('ChannelUp');
      tizen.tvinputdevice.registerKey('ChannelDown');
      tizen.tvinputdevice.registerKey('ColorF0Red');
    }
  } catch (e) {}

  document.addEventListener('keydown', function (ev) {
    var open = player.classList.contains('open');
    if (form.classList.contains('open')) {
      if (formKey(ev.keyCode)) { ev.preventDefault(); }
      return;
    }
    switch (ev.keyCode) {
      case KEY.CH_UP: zap(1); break;
      case KEY.CH_DOWN: zap(-1); break;
      case KEY.BACK:
      case KEY.ESC: if (open) { stop(); } else { exitApp(); } break;
      case KEY.ENTER:
        if (open) { showTag(); } else if (index === CHANNELS.length) { openForm(); } else { play(); }
        break;
      case KEY.RED: if (!open) { removeOwn(); } break;
      case KEY.LEFT: if (!open) { move(-1); } break;
      case KEY.RIGHT: if (!open) { move(1); } break;
      case KEY.UP: if (!open) { move(-COLUMNS); } break;
      case KEY.DOWN: if (!open) { move(COLUMNS); } break;
      default: return;
    }
    ev.preventDefault();
  });

  function tick() {
    var d = new Date();
    clock.textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  tick();
  setInterval(tick, 10000);
  render();

  fetch(LIST_URL + '?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (list) {
    var valid = list.filter(function (c) { return c && c.name && (c.id || c.url); });
    if (valid.length && !player.classList.contains('open')) { baseChannels = valid; CHANNELS = baseChannels.concat(ownChannels); render(); }
  }).catch(function () {});
})();
</script>
</body>
</html>
